name: Check and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:public -- --tracked
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-iter-chrome
          path: |
            release/vibe-iter-chrome.zip
            release/SHA256SUMS.txt
