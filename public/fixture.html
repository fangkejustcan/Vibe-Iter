<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Iter Fixture Game</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f2eee7; background: #17201f; font: 16px sans-serif; }
      main { width: min(88vw, 560px); padding: 40px; border: 1px solid #4e726c; background: #20302d; }
      button { padding: 14px 20px; color: #17201f; background: #d5e46d; border: 0; font: inherit; }
      canvas { display: block; width: 100%; height: 90px; margin-top: 26px; background: #101716; }
    </style>
  </head>
  <body>
    <main>
      <p>Fixture game screen</p>
      <button id="launch">Launch ferry</button>
      <canvas id="world" width="700" height="140" aria-label="Resort world"></canvas>
    </main>
    <script>
      document.getElementById('launch').addEventListener('click', function () {
        this.textContent = 'Ferry launched';
      });
      const canvas = document.getElementById('world');
      const context = canvas.getContext('2d');
      context.fillStyle = '#86d4c7';
      context.fillRect(120, 44, 460, 40);
    </script>
  </body>
</html>
